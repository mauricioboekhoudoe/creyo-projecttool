name = "creyo-projecttool"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Only reachable through the custom domain behind Cloudflare Access.
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first for every request, so nothing is served without a valid Access login.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "creyo-projecttool"
database_id = "61104e27-ec6c-4f85-89d9-99c9a74bbb6d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "creyo-projecttool-files"

[vars]
# Cloudflare Zero Trust team domain, e.g. "boekhoudoe.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM_DOMAIN"
# Application Audience (AUD) tag of the Access application for this hostname
ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD"
# People who may use the tool. "admin": true may export, apply updates and roll back.
PEOPLE = '{"M":{"name":"Mauricio","email":"mauricio@boekhoudoe.nl","admin":true},"C":{"name":"Charona","email":"REPLACE_WITH_CHARONA_EMAIL","admin":false}}'
